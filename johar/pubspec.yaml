name: johar
description: AR safety training and certification for workers in Jharkhand's mines, steel plants and mica units.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_tts: ^4.2.0

  # Firebase (run `flutterfire configure` to generate lib/firebase_options.dart)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Camera + permissions
  camera: ^0.11.2+1
  permission_handler: 11.3.1

  # Offline storage + sync
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  connectivity_plus: ^6.1.0

  # Certificates
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  cryptography: ^2.7.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/modules/
    - assets/ar/items/
    - assets/images/

  # Fonts are bundled (not google_fonts) so every script renders offline.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansOlChiki
      fonts:
        - asset: assets/fonts/NotoSansOlChiki-Regular.ttf
        - asset: assets/fonts/NotoSansOlChiki-Bold.ttf
          weight: 700
